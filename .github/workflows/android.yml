name: Build JASSIM AI APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for backend tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Colab notebook JSON and Python cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("notebooks/JASSIM_AI_Colab_GPU.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") == "code":
                  source = "".join(cell.get("source", []))
                  compile(source, f"{path}:cell-{index}", "exec")
          print(f"Validated {len(notebook.get('cells', []))} notebook cells")
          PY

      - name: Test self-hosted backend
        run: python -m unittest discover -s backend -p 'test_*.py' -v

      - name: Validate dashboard JavaScript and local assets
        run: |
          node --check dashboard/app.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path("dashboard")
          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ("src", "href"):
                      value = attrs.get(key, "")
                      if not value or value.startswith(("#", "data:", "mailto:")):
                          continue
                      parsed = urlparse(value)
                      if parsed.scheme or parsed.netloc:
                          continue
                      self.paths.append(value.split("?", 1)[0].split("#", 1)[0])

          parser = Assets()
          parser.feed((root / "index.html").read_text(encoding="utf-8"))
          missing = [value for value in parser.paths if not (root / value).is_file()]
          if missing:
              raise SystemExit("Missing dashboard assets: " + ", ".join(missing))
          print("Dashboard HTML local assets verified:", len(parser.paths))
          html = (root / "index.html").read_text(encoding="utf-8")
          js = (root / "app.js").read_text(encoding="utf-8")
          if 'id="generateImage" disabled' not in html:
              raise SystemExit("Image generation must start disabled until server readiness is known")
          if "imageButton.disabled=!imageReady" not in js:
              raise SystemExit("Image generation button must follow the server readiness flag")
          PY


      - name: Verify configured private JASSIM model readiness
        if: ${{ vars.JASSIM_HEALTHCHECK_URL != '' }}
        env:
          JASSIM_HEALTHCHECK_URL: ${{ vars.JASSIM_HEALTHCHECK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base_url = os.environ["JASSIM_HEALTHCHECK_URL"].strip().rstrip("/")
          if not base_url.startswith("https://"):
              raise SystemExit("JASSIM_HEALTHCHECK_URL must use HTTPS")
          url = base_url + "/ready"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      data = json.loads(response.read().decode("utf-8"))
                  if data.get("ready") is not True or data.get("engine") != "private-ollama":
                      raise RuntimeError(
                          "Private JASSIM model is not ready: "
                          f"ready={data.get('ready')} engine={data.get('engine')}"
                      )
                  print("JASSIM_PRIVATE_MODEL_READY:", data.get("engine"))
                  break
              except Exception as exc:
                  if attempt == 11:
                      raise
                  print(f"Readiness attempt {attempt + 1}/12 failed: {exc}")
                  time.sleep(5)
          PY

      - name: Mark private deployment readiness as unverified
        if: ${{ vars.JASSIM_HEALTHCHECK_URL == '' }}
        run: |
          echo "::warning::PRIVATE_DEPLOYMENT_UNVERIFIED: JASSIM_HEALTHCHECK_URL is not configured. Local tests and APK build do not prove that the private model server is online or ready for public users."
          echo "Deployment status: UNVERIFIED (no health-check URL configured)."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::KVM device /dev/kvm is unavailable on this runner"
            exit 1
          fi
          ls -l /dev/kvm

      - name: Android Emulator install and launch smoke test
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/.github/scripts/emulator-smoke.sh"

      - name: Collect emulator diagnostics
        if: always()
        run: bash .github/scripts/emulator-diagnostics.sh

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JASSIM-Android-emulator-diagnostics
          path: ${{ runner.temp }}/jassim-emulator-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify APK package
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file() or apk.stat().st_size < 10240:
              raise SystemExit("APK is missing or unexpectedly small")
          with zipfile.ZipFile(apk) as archive:
              bad_entry = archive.testzip()
              if bad_entry:
                  raise SystemExit(f"Corrupt APK entry: {bad_entry}")
              names = set(archive.namelist())
              required = {"AndroidManifest.xml", "classes.dex"}
              missing = required - names
              if missing:
                  raise SystemExit(f"APK is missing required entries: {sorted(missing)}")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          print(f"Verified APK: {apk.stat().st_size} bytes")
          print(f"SHA-256: {digest}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JASSIM-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
