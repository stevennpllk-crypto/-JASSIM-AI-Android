name: Build JASSIM AI APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for backend tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Colab notebook JSON and Python cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("notebooks/JASSIM_AI_Colab_GPU.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") == "code":
                  source = "".join(cell.get("source", []))
                  compile(source, f"{path}:cell-{index}", "exec")
          print(f"Validated {len(notebook.get('cells', []))} notebook cells")
          PY

      - name: Test self-hosted backend
        run: python -m unittest discover -s backend -p 'test_*.py' -v

      - name: Verify deployed JASSIM server health
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = "https://jassim-ai-core-final-production.up.railway.app/health"
          last_error = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      data = json.loads(response.read().decode("utf-8"))
                  if not data.get("ok"):
                      raise RuntimeError(f"Unexpected health payload: {data}")
                  print("JASSIM_SERVER_ONLINE:", data.get("version"), data.get("engine"))
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 11:
                      raise
                  print(f"Health check attempt {attempt + 1}/12 failed: {exc}")
                  time.sleep(5)
          PY

      - name: Probe anonymous JarvisClaw fallback
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          url = "https://api.jarvisclaw.ai/v1/chat/completions"
          body = json.dumps({
              "model": "auto/free",
              "messages": [{"role": "user", "content": "Reply exactly: JASSIM ONLINE"}],
              "stream": False,
              "max_tokens": 40
          }).encode()
          req = urllib.request.Request(url, data=body, headers={
              "Content-Type": "application/json"
          })
          try:
              with urllib.request.urlopen(req, timeout=90) as response:
                  data = json.loads(response.read())
                  answer = data["choices"][0]["message"]["content"]
                  print("ANONYMOUS_LLM_OK:", answer[:300])
          except Exception as exc:
              print("ANONYMOUS_LLM_UNAVAILABLE:", repr(exc))
              raise
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify APK package
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file() or apk.stat().st_size < 10240:
              raise SystemExit("APK is missing or unexpectedly small")
          with zipfile.ZipFile(apk) as archive:
              bad_entry = archive.testzip()
              if bad_entry:
                  raise SystemExit(f"Corrupt APK entry: {bad_entry}")
              names = set(archive.namelist())
              required = {"AndroidManifest.xml", "classes.dex"}
              missing = required - names
              if missing:
                  raise SystemExit(f"APK is missing required entries: {sorted(missing)}")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          print(f"Verified APK: {apk.stat().st_size} bytes")
          print(f"SHA-256: {digest}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JASSIM-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
