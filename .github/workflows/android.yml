name: Build JASSIM AI APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for backend tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Colab notebook JSON and Python cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("notebooks/JASSIM_AI_Colab_GPU.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") == "code":
                  source = "".join(cell.get("source", []))
                  compile(source, f"{path}:cell-{index}", "exec")
          print(f"Validated {len(notebook.get('cells', []))} notebook cells")
          PY

      - name: Test self-hosted backend
        run: python -m unittest discover -s backend -p 'test_*.py' -v

      - name: Verify deployed JASSIM server health
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = "https://jassim-ai-core-final-production.up.railway.app/health"
          last_error = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      data = json.loads(response.read().decode("utf-8"))
                  if not data.get("ok"):
                      raise RuntimeError(f"Unexpected health payload: {data}")
                  print("JASSIM_SERVER_ONLINE:", data.get("version"), data.get("engine"))
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 11:
                      raise
                  print(f"Health check attempt {attempt + 1}/12 failed: {exc}")
                  time.sleep(5)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Android Emulator smoke test
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -Eeuo pipefail
            SERIAL="emulator-5554"
            APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"

            adb devices -l
            test "$(adb -s "$SERIAL" get-state)" = "device"
            test "$(adb -s "$SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = "1"
            test -s "$APK"
            adb install -r "$APK"
            adb shell am force-stop com.jassim.ai
            adb logcat -c

            # am start -W can time out on a slow headless emulator even when the
            # activity is still starting. Keep checking the process, but never
            # turn a crash into a passing smoke test.
            start_output="$(adb shell am start -W -n com.jassim.ai/.MainActivity 2>&1 || true)"
            printf '%s\n' "$start_output"
            for attempt in $(seq 1 30); do
              if adb shell pidof com.jassim.ai >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done

            if ! adb shell pidof com.jassim.ai >/dev/null 2>&1; then
              echo "::error::JASSIM process did not stay alive after MainActivity launch"
              echo "::group::Focused Android crash diagnostics"
              adb logcat -b crash -d -v threadtime || true
              adb logcat -d -v threadtime -s AndroidRuntime ActivityManager ActivityTaskManager System.err || true
              adb shell dumpsys package com.jassim.ai || true
              adb shell dumpsys activity activities | tail -n 120 || true
              echo "::endgroup::"
              exit 1
            fi

            resumed="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tail -n 1 || true)"
            echo "Resumed activity: $resumed"
            echo "$resumed" | grep -q 'com.jassim.ai/.MainActivity'
            echo "ANDROID_EMULATOR_SMOKE_OK: APK installed, MainActivity foregrounded, and process alive"

      - name: Verify APK package
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file() or apk.stat().st_size < 10240:
              raise SystemExit("APK is missing or unexpectedly small")
          with zipfile.ZipFile(apk) as archive:
              bad_entry = archive.testzip()
              if bad_entry:
                  raise SystemExit(f"Corrupt APK entry: {bad_entry}")
              names = set(archive.namelist())
              required = {"AndroidManifest.xml", "classes.dex"}
              missing = required - names
              if missing:
                  raise SystemExit(f"APK is missing required entries: {sorted(missing)}")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          print(f"Verified APK: {apk.stat().st_size} bytes")
          print(f"SHA-256: {digest}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JASSIM-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
