name: Build JASSIM AI APK
# CI validation for the fast local-model availability routing path.

on:
  push:
    branches: [ "main", "fix/android-message-line-breaks" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for backend tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Colab and Kaggle notebook JSON and Python cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("notebooks/JASSIM_AI_Colab_GPU.ipynb"),
              Path("notebooks/JASSIM_AI_Kaggle_Free_GPU.ipynb"),
          ]
          for path in paths:
              notebook = json.loads(path.read_text(encoding="utf-8"))
              for index, cell in enumerate(notebook.get("cells", [])):
                  if cell.get("cell_type") == "code":
                      source = "".join(cell.get("source", []))
                      compile(source, f"{path}:cell-{index}", "exec")
              print(f"Validated {path}: {len(notebook.get('cells', []))} cells")
          PY

      - name: Test self-hosted backend
        run: python -m unittest discover -s backend -p 'test_*.py' -v

      - name: Test private local-model benchmark harness
        run: python -m unittest discover -s backend -p 'test_local_model_benchmark.py' -v

      - name: Test Kaggle notebook privacy policy
        run: python -m unittest discover -s backend -p 'test_kaggle_notebook.py' -v

      - name: Test private image worker API
        run: |
          python -m pip install -r image-worker/requirements-test.txt
          python -m unittest discover -s image-worker -p 'test_*.py' -v

      - name: Validate dashboard JavaScript syntax
        run: node --check dashboard/app.js

      - name: Verify deployed JASSIM API liveness
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = "https://jassim-ai-core-final-production.up.railway.app/health"
          last_error = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      data = json.loads(response.read().decode("utf-8"))
                  if not data.get("ok"):
                      raise RuntimeError(f"Unexpected health payload: {data}")
                  print("JASSIM_API_LIVE:", data.get("version"), data.get("engine"))
                  print("OLLAMA_REACHABLE:", data.get("ollama_reachable"))
                  print("MODEL_READY:", data.get("model_ready"))
                  print("EXTERNAL_PROVIDER_ROUTE_ENABLED:", data.get("external_provider_ready"))
                  print("NOTE: /health proves API liveness only; it does not prove model readiness or successful inference.")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 11:
                      raise
                  print(f"Health check attempt {attempt + 1}/12 failed: {exc}")
                  time.sleep(5)
          PY

      - name: Audit production private-inference readiness
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = "https://jassim-ai-core-final-production.up.railway.app/health"
          with urllib.request.urlopen(url, timeout=20) as response:
              data = json.loads(response.read().decode("utf-8"))
          model_ready = bool(data.get("model_ready", False))
          external_enabled = bool(data.get("external_provider_ready", False))
          provider = data.get("provider") or data.get("engine") or "unknown"
          print("PRODUCTION_MODEL_READY:", model_ready)
          print("PRODUCTION_EXTERNAL_ROUTE_ENABLED:", external_enabled)
          print("PRODUCTION_PROVIDER_OR_ENGINE:", provider)
          if not model_ready:
              print("::warning::Production local model is not ready; private inference is not verified.")
          if external_enabled:
              print("::warning::Production external-provider routing is enabled; this is not private-only inference.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Production private-inference readiness\\n")
              summary.write(f"- Local model ready: **{model_ready}**\\n")
              summary.write(f"- External-provider route enabled: **{external_enabled}**\\n")
              summary.write(f"- Provider/engine reported: `{provider}`\\n")
              summary.write("- This audit does not send a prompt to any public AI provider.\\n")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify APK package
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file() or apk.stat().st_size < 10240:
              raise SystemExit("APK is missing or unexpectedly small")
          with zipfile.ZipFile(apk) as archive:
              bad_entry = archive.testzip()
              if bad_entry:
                  raise SystemExit(f"Corrupt APK entry: {bad_entry}")
              names = set(archive.namelist())
              required = {"AndroidManifest.xml", "classes.dex"}
              missing = required - names
              if missing:
                  raise SystemExit(f"APK is missing required entries: {sorted(missing)}")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          print(f"Verified APK: {apk.stat().st_size} bytes")
          print(f"SHA-256: {digest}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JASSIM-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
