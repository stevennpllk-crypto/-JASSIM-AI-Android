name: Verify local-only inference privacy
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/probe-llm-fallback.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/probe-llm-fallback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify external inference is blocked without network access
        run: |
          python -m unittest discover -s backend -p 'test_local_only.py' -v
          python - <<'PY'
          import sys
          sys.path.insert(0, "backend")
          import adaptive
          assert adaptive.ALLOW_EXTERNAL_CHAT is False
          assert adaptive.ENABLE_PUBLIC_PROVIDERS is False
          assert adaptive.external_chat_enabled() is False
          print("PASS: user prompts cannot route to public inference providers.")
          PY
